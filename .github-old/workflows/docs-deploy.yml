name: Build and Deploy Documentation

on:
  push:
    branches:
      - main
      - master
    paths:
      - 'docs-site/**'
      - '.github/workflows/docs-deploy.yml'
  pull_request:
    branches:
      - main
      - master
    paths:
      - 'docs-site/**'

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          cache-dependency-path: 'docs-site/package-lock.json'
      
      - name: Install dependencies
        working-directory: ./docs-site
        run: npm install
      
      - name: Build documentation
        working-directory: ./docs-site
        run: npm run build
      
      - name: Validate links
        working-directory: ./docs-site
        run: |
          # Install link checker
          npm install -g broken-link-checker-local
          # Start a local server and check for broken links
          cd build && python3 -m http.server 8000 &
          SERVER_PID=$!
          sleep 2
          # Check for broken links
          blc http://localhost:8000 -r --skip-external || true
          kill $SERVER_PID || true
      
      - name: List build output
        run: ls -la docs-site/build/
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v3
        with:
          name: docs-build
          path: docs-site/build/
          retention-days: 7
  
  deploy-to-cloudflare:
    needs: build-and-validate
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Download build artifacts
        uses: actions/download-artifact@v3
        with:
          name: docs-build
          path: docs-site/build/
      
      - name: Deploy to CloudFlare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy docs-site/build --project-name=contexthub-docs
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

  validate-deployment:
    needs: deploy-to-cloudflare
    runs-on: ubuntu-latest
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    
    steps:
      - name: Wait for CloudFlare deployment
        run: sleep 10
      
      - name: Verify deployment
        run: |
          # Test the custom domain (or staging URL)
          curl -s -I https://docs.contexthub.internal || curl -s -I https://docs.contexthub.internal.pages.dev
          echo "Deployment validation complete"
