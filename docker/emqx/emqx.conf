## Paperclip EMQX configuration for the A2A-over-MQTT transport (Phase 1.5/1.6).
##
## Wires EMQX's HTTP authentication + HTTP authorization backends to the
## callbacks Paperclip exposes on the server:
##
##   POST /api/internal/mqtt-auth   -> server/src/mqtt/auth-backend.ts
##   POST /api/internal/mqtt-acl    -> server/src/mqtt/acl-backend.ts
##
## The server resolves to `server:3100` on the compose network. EMQX caches
## ACL answers per-client (see authorization.cache below) so the callbacks
## are not on the hot path for every publish/subscribe.
##
## Host singleton auth: the server's own MQTT client connects with
##   username = "host:paperclip-server"
##   password = $PAPERCLIP_MQTT_HOST_PASSWORD  (or anonymous when
##              PAPERCLIP_MQTT_ALLOW_ANONYMOUS_HOST=true in dev)
## both sides go through the same HTTP auth callback; the bypass lives in
## auth-backend.ts, not here.

node {
  name = "paperclip-emqx@127.0.0.1"
  cookie = "emqxsecretcookie"
  # EMQX 6.x requires this; the image's default is /opt/emqx/data and is
  # backed by the `emqx_data` volume in docker-compose.yml.
  data_dir = "/opt/emqx/data"
}

authentication = [
  {
    mechanism = password_based
    backend = http
    method = post
    url = "http://host.docker.internal:3100/api/internal/mqtt-auth"
    body {
      username = "${username}"
      password = "${password}"
      clientid = "${clientid}"
      peerhost = "${peerhost}"
    }
    headers {
      "content-type" = "application/json"
      ## Hardcoded for local dev because HOCON env-var interpolation
      ## (both ${VAR} and ${?VAR} forms) didn't pick up the docker-compose
      ## passthrough env var. The value mirrors PAPERCLIP_MQTT_INTERNAL_SECRET
      ## in the repo-root .env (gitignored). For production, generate a fresh
      ## secret per environment and template this file via your deploy tool.
      "X-Paperclip-Mqtt-Internal-Secret" = "470884805107d3df82a19162c68be3fb5edd66c8c257465f199bdcb703969fe9"
    }
    connect_timeout = "5s"
    request_timeout = "5s"
    pool_size = 8
    enable_pipelining = 100
  }
]

authorization {
  sources = [
    {
      type = http
      enable = true
      method = post
      url = "http://host.docker.internal:3100/api/internal/mqtt-acl"
      body {
        username = "${username}"
        clientid = "${clientid}"
        action = "${action}"
        topic = "${topic}"
      }
      headers {
        "content-type" = "application/json"
        ## Hardcoded for local dev because HOCON env-var interpolation
      ## (both ${VAR} and ${?VAR} forms) didn't pick up the docker-compose
      ## passthrough env var. The value mirrors PAPERCLIP_MQTT_INTERNAL_SECRET
      ## in the repo-root .env (gitignored). For production, generate a fresh
      ## secret per environment and template this file via your deploy tool.
      "X-Paperclip-Mqtt-Internal-Secret" = "470884805107d3df82a19162c68be3fb5edd66c8c257465f199bdcb703969fe9"
      }
      connect_timeout = "5s"
      request_timeout = "5s"
      pool_size = 8
      enable_pipelining = 100
    }
  ]
  no_match = deny
  deny_action = ignore
  cache {
    enable = true
    max_size = 256
    ## TTL kept at the EMQX default (1m). Higher TTLs (we previously ran 10m)
    ## are dangerous for dynamic-permission flows: when a fresh discussion is
    ## opened, any prior `deny` for that exact `{clientid, topic, action}`
    ## tuple is pinned in the broker for the full TTL and no host signal can
    ## drain it. With 1m the broker self-heals fast. If a faster recovery is
    ## needed, shell out to `emqx ctl authz cache-clean <clientid>` after
    ## invalidating the host-side cache.
    ttl = "1m"
  }
}

## Phase 1.16-EMQX E2 — Enable the EMQX A2A Registry so the broker auto-
## indexes Agent Cards published to `$a2a/v1/discovery/+/+/+` and tracks
## per-agent liveness via LWT (`a2a-status=offline`). Inspect with
## `emqx ctl a2a_registry list` / `... stats` / `... get ORG UNIT AGENT`.
## When `validate_schema = true`, EMQX rejects cards that don't conform
## to the spec — catches our projector bugs early. Both flags are
## documented in EMQX 6.2 docs at emqx-ai/a2a-over-mqtt/manage-agents.md
a2a_registry {
  enable = true
  validate_schema = true
}
